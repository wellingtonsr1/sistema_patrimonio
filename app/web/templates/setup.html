<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Aplica o tema antes da renderização (evita flash e mantém Bootstrap sincronizado)
        (function () {
            try {
                var t = localStorage.getItem('sispatrim-theme');
                if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    <title>Configuração Inicial | SisPatrimônio Pro</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=20260905">
</head>
<body>
    <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;min-height:100dvh;padding:1.5rem;">
        <div class="w-100" style="max-width:460px;">
            <!-- Brand -->
            <div class="text-center mb-4">
                <span class="navbar-brand-icon d-inline-flex" style="width:52px;height:52px;font-size:1.4rem;">
                    <i class="bi bi-box-seam"></i>
                </span>
                <h4 class="fw-bold mt-3 mb-0" style="letter-spacing:-.02em;">SisPatrimônio <span class="badge badge-soft-primary fw-normal" style="font-size:.65rem;vertical-align:middle;">PRO</span></h4>
                <p class="text-muted small mt-1 mb-0">Gestão Patrimonial &amp; Fluxo de Movimentação</p>
            </div>

            <!-- Configuração Inicial Card -->
            <div class="card shadow-sm border-0" style="border-radius:14px;background:var(--c-surface);">
                <div class="card-body p-4 p-md-5">
                    <h5 class="fw-bold mb-1" style="font-size:1.05rem;">Configuração Inicial</h5>
                    <p class="text-muted small mb-4">Crie o administrador do sistema para continuar.</p>

                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 small mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    <form method="post" action="/setup">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small" for="full_name">Nome completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person-fill"></i></span>
                                <input type="text" id="full_name" name="full_name" class="form-control border-start-0" placeholder="Seu nome completo" required autocomplete="name">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small" for="username">Nome de usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" name="username" class="form-control border-start-0" placeholder="Seu nome de usuário" required autocomplete="username">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small" for="email">E-mail</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" name="email" class="form-control border-start-0" placeholder="Seu e-mail (opcional)" autocomplete="email">
                            </div>
                            <small class="text-muted mt-1 d-block">Preencha se aplicável.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small" for="password">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="Crie uma senha" required autocomplete="new-password" minlength="8">
                            </div>
                            <small class="text-muted mt-1 d-block">Mínimo 8 caracteres.</small>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small" for="confirm_password">Confirmar senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control border-start-0" placeholder="Confirme sua senha" required autocomplete="new-password" minlength="8">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                            <i class="bi bi-person-plus me-1"></i> Criar administrador
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-center text-muted small mt-4 mb-0">
                {{ app_name }} v{{ app_version }} &bull; {{ company_name }}
            </p>
        </div>
    </div>

    <!-- Bootstrap 5 JS + custom (tema claro/escuro) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
