{% extends "base.html" %}

{% block title %}Novo Colaborador | SisPatrimônio Pro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8">
        <div class="page-header">
            <div>
                <h3 class="page-header-title">Cadastrar Colaborador</h3>
                <p class="page-header-subtitle">Adicione um novo colaborador ao sistema para permitir alocação de equipamentos.</p>
            </div>
            <a href="/custodians" class="btn btn-ghost">
                <i class="bi bi-arrow-left me-1"></i> Voltar
            </a>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/custodians/new" class="card p-4">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label">Matrícula / Código Funcional <span class="text-danger">*</span></label>
                    <input type="text" name="registration_code" class="form-control font-monospace" placeholder="Ex: MAT-1045" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Nome Completo <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" placeholder="Ex: Carlos Eduardo Silva" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">E-mail Corporativo <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" placeholder="carlos.silva@empresa.com" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">CPF</label>
                    <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Cargo / Função <span class="text-danger">*</span></label>
                    <input type="text" name="role" class="form-control" placeholder="Ex: Desenvolvedor Senior" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Departamento / Setor <span class="text-danger">*</span></label>
                    <input type="text" name="department" class="form-control" placeholder="Ex: Engenharia de Software" required>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
                <a href="/custodians" class="btn btn-ghost px-4">Cancelar</a>
                <button type="submit" class="btn btn-primary px-4 fw-bold">
                    <i class="bi bi-check-lg me-1"></i> Salvar Colaborador
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
