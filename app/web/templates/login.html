<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Aplica o tema antes da renderização (evita flash e mantém Bootstrap sincronizado)
        (function () {
            try {
                var t = localStorage.getItem('sispatrim-theme');
                if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    <title>Entrar | SisPatrimônio Pro</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=20260905">
</head>
<body>
    <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;min-height:100dvh;padding:1.5rem;background-color: rgb(252, 246, 246);">
        <div class="w-100" style="max-width:420px;;">
            <!-- Brand -->
            <div class="text-center mb-4">
                <span class="navbar-brand-icon d-inline-flex" style="width:52px;height:52px;font-size:1.4rem;">
                    <i class="bi bi-box-seam"></i>
                </span>
                <h4 class="fw-bold mt-3 mb-0 text-dark" style="letter-spacing:-.02em;">
                    SisPatrimônio 
                    <span class="badge bg-danger-subtle text-danger border border-danger-subtle fw-normal" style="font-size:.65rem;vertical-align:middle;">PRO</span>
                </h4>
                <p class="text-secondary small mt-1 mb-0">Gestão Patrimonial &amp; Fluxo de Movimentação</p>
            </div>

            <!-- Login Card -->
            <div class="card shadow-sm border border-2 border-secondary-subtle" style="border-radius:14px;background:var(--c-surface);">
                <div class="card-body p-4 p-md-5">
                    <h5 class="fw-bold mb-1" style="font-size:1.06rem;">Acesse o sistema</h5>
                    <p class="text-muted small mb-4">Entre com suas credenciais para continuar.</p>

                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 small mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    <form method="post" action="/login">
                        <input type="hidden" name="next" value="{{ next }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small" for="username">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" name="username" class="form-control border-start-0" placeholder="Seu usuário" required autofocus autocomplete="username">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small" for="password">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="Sua senha" required autocomplete="current-password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/setup" class="text-decoration-none text-primary small fw-semibold">
                            <i class="bi bi-person-plus me-1"></i> Primeiro acesso
                        </a>
                    </div>
                </div>
            </div>

            <p class="text-center text-muted small mt-4 mb-0">
                {{ app_name }} v{{ app_version }} &bull; {{ company_name }}
            </p>
        </div>
    </div>

    <!-- Bootstrap 5 JS + custom (tema claro/escuro) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
