{% extends "base.html" %}

{% block title %}Não Encontrado{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card text-center p-5" style="border-radius:14px;">
            <div class="display-1 text-muted mb-2"><i class="bi bi-search"></i></div>
            <h4 class="fw-bold mb-2" style="letter-spacing:-.02em;">Recurso não encontrado</h4>
            <p class="text-muted mb-4">
                O item ou página que você procura não existe ou foi removido.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i> Voltar ao Início
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
